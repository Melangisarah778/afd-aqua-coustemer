 <h2>🔔 ${u('ntf')}</h2>${NTF.slice(0,3).map(n=>`<div class="nt ${n[0]}">${T(n[1])}</div>`).join('')}<div class="card" style="margin-top:14px;border-top:6px solid var(--o)"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="font-size:36px">🦐</div><div><b style="font-size:18px">AFD AQUA — ${u('ct')}</b><div style="font-size:26px;font-weight:900;color:var(--g)">70137 13646</div></div></div><a class="cb" style="background:#16a34a" href="tel:+917013713646">📞 ${u('cn')}</a><a class="cb" style="background:#25D366;color:#053b1a" target="_blank" href="https://wa.me/917013713646?text=Hello%20AFD%20AQUA">💬 ${u('wc')}</a></div>`}
function prices(){const cs=Object.keys(SP[S.sp].c);return`<h2>₹ ${u('prices')}</h2>${filters()}<p style="font-size:13px;color:var(--mu)">👁️ ${vw(S.mk+S.sp).td.toLocaleString()} ${u('vt')} · 🔥 ${vw(S.mk).h24.toLocaleString()} ${u('v24')}</p>
 <div class="grid">${cs.map(c=>pcard(S.sp,c)).join('')}</div>
 <div class="card"><table><tr><th>${u('cnt')}</th>${DAYS.map((_,i)=>`<th>${dshort(dstr(6-i))}</th>`).join('')}</tr>${cs.map(c=>`<tr onclick="go('detail',['${S.sp}','${c}'])" style="cursor:pointer"><td><b>${c}</b></td>${getHist(S.mk,S.sp,c).map(x=>`<td>₹${x.p}</td>`).join('')}</tr>`).join('')}</table></div><p style="font-size:11px;color:var(--mu);text-align:center">ℹ️ ${u('demo')}</p>`}
function services(){return`<h2>🧪 ${u('services')}</h2><div class="grid w">${SV.map((s,i)=>`<div class="card" style="border-top:6px solid ${['#22d3ee','#22c55e','#ff9f1c'][i%3]}"><div style="font-size:34px">${s[0]}</div><b>${T(s[1])}</b><p>${T(s[2])}<br>📍 Andhra Pradesh</p><button class="btn s g">${u('view')}</button><a href="tel:+917013713646"><button class="btn s">📞 ${u('call')}</button></a><a target="_blank" href="https://www.google.com/maps/search/${encodeURIComponent(s[1].split('|')[0]+' near me')}"><button class="btn s b">🧭 ${u('dir')}</button></a></div>`).join('')}</div>`}
let nf={d:10,o:0};
function nearby(){const l=NB.filter(x=>x[2]<=nf.d&&(!nf.o||x[4]));return`<h2>📍 ${u('nearby')}</h2><div class="card"><div class="f"><div><label>${u('dst')} (km)</label><select onchange="nf.d=+this.value;render()">${[2,5,10].map(d=>`<option ${d==nf.d?'selected':''}>${d}</option>`).join('')}</select></div><div><label>${u('op')}</label><select onchange="nf.o=+this.value;render()"><option value="0">${u('all')}</option><option value="1" ${nf.o?'selected':''}>${u('op')}</option></select></div></div><button class="btn g" onclick="navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>alert(p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3)),()=>0)">📍 ${u('fn')}</button></div>
 <div id="map" class="card" style="height:150px;display:grid;place-items:center;background:linear-gradient(135deg,#bdf0f9,#d9fbe5);color:#0b2f3d">🗺️ Map API slot (Google Maps / Leaflet) → #map</div>
 <div class="grid w">${l.map(x=>`<div class="card"><b>${x[1]} ${x[0]}</b><p>${u('dst')}: <b>${x[2]} km</b> · ⭐ ${x[3]}<br><span class="tag ${x[4]?'ad':''}">${x[4]?u('op'):'Closed'}</span></p><button class="btn s">📞 ${u('call')}</button><button class="btn s b">🧭 ${u('dir')}</button></div>`).join('')||u('nores')}</div>`}
function knowledge(){return`<h2>📚 ${u('knowledge')}</h2><div class="grid w">${KN.map((k,i)=>`<div class="card" style="border-top:6px solid ${['#22d3ee','#22c55e','#ff9f1c'][i%3]}"><div style="height:70px;border-radius:14px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#bdf0f9,#d9fbe5)">${k[0]}</div><b>${T(k[1])}</b><p>${T(k[2])}</p><button class="btn s g" onclick="alert(T(KN[${i}][2]))">${u('read')}</button></div>`).join('')}</div>`}
function tools(){return`<h2>🧮 ${u('tools')}</h2><div class="grid w">${CA.map((c,i)=>`<div class="card"><b>${c[0]} ${T(c[1])}</b>${c[2].map((f,j)=>`<label>${f[0]}</label><input type="number" inputmode="decimal" id="c${i}_${j}" value="${f[1]}" style="font-size:20px">`).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="rc(${i})">${u('calc')}</button><div id="r${i}"></div></div>`).join('')}</div>`}
function rc(i){const v=CA[i][2].map((_,j)=>+$('#c'+i+'_'+j).value),r=CA[i][3](v);$('#r'+i).innerHTML=`<div class="res">${r.includes('|')?T(r):r}</div>`}
function profile(){const me=ls('me',null);
if(me)return`<div class="card" style="text-align:center"><div style="font-size:54px">👨‍🌾</div><h2>${u('wl')}, ${me.n}!</h2><p style="font-size:20px">📞 ${me.p}</p><button class="btn" onclick="lc()">🌐 ${u('chl')}</button><button class="btn b" onclick="sv('me',null);render()">${u('lo')}</button></div>`;
return`<div class="card"><h2 style="margin-top:0">👤 ${u('login')} / ${u('reg')}</h2><label>${u('nm')}</label><input id="un"><label>${u('ph')}</label><input id="up" type="tel" maxlength="10" inputmode="numeric"><label>${u('pw')}</label><input id="uw" type="password"><div id="um"></div><button class="btn g" onclick="au(1)">${u('login')}</button><button class="btn" onclick="au(0)">${u('reg')}</button><button class="btn b" onclick="lc()">🌐 ${u('chl')}</button></div>`}
function lc(){$('#lm').style.display='grid'}
function au(l){const n=$('#un').value.trim(),p=$('#up').value.trim(),w=btoa($('#uw').value),us=ls('users',{}),e=k=>$('#um').innerHTML=`<div class="nt">${u(k)}</div>`;
 if(!/^\d{10}$/.test(p)||$('#uw').value.length<4||(!l&&!n))return e('wr');
 if(l){if(!us[p]||us[p].w!==w)return e('wr');sv('me',{n:us[p].n,p})}else{if(us[p])return e('ex');us[p]={n,w};sv('users',us);sv('me',{n,p})}
 render()}
function search(){const t=q.toLowerCase(),r=[];if(t){Object.entries(DISTS).forEach(([d,m])=>m.forEach(k=>k.toLowerCase().includes(t)&&r.push(['🏪 '+k,'prices'])));
 Object.keys(SP).forEach(k=>(SP[k].n.toLowerCase().includes(t)||Object.keys(SP[k].c).some(c=>(c+'').includes(t)))&&r.push([SP[k].i+' '+T(SP[k].n),'prices',k]));
 SV.forEach(s=>s.join('|').toLowerCase().includes(t)&&r.push([s[0]+' '+T(s[1]),'services']));KN.forEach(s=>s.join('|').toLowerCase().includes(t)&&r.push([s[0]+' '+T(s[2-1]),'knowledge']));NB.forEach(s=>s[0].toLowerCase().includes(t)&&r.push([s[1]+' '+s[0],'nearby']))}
 return`<h2>🔍</h2><input id="q" value="${q}" placeholder="${u('srch')}" oninput="q=this.value;sr()" autofocus><div id="sr">${sh(r)}</div>`}
const sh=r=>r.map(x=>`<div class="card" style="margin-top:8px;cursor:pointer" onclick="${x[2]?`S.sp='${x[2]}';`:''}go('${x[1]}')"><b>${x[0]}</b></div>`).join('')||(q?u('nores'):'');
function sr(){const f=$('#q');const v=f.value;const keep=document.activeElement===f;page='search';const h=search();$('#sr').innerHTML=h.slice(h.indexOf('<div id="sr">')+13,h.lastIndexOf('</div>'))}
function render(){const act=page=='detail'?'prices':page;
 $('#tn').innerHTML=NAV.map(n=>`<a class="${act==n[0]?'on':''}" onclick="go('${n[0]}')">${n[0]=='nearby'?u('nearby'):u(n[2])}</a>`).join('');
 $('#bn').innerHTML=[['home','🏠','home'],['prices','₹','prices'],['services','🧪','services'],['knowledge','📚','knowledge'],['profile','👤','profile']].map(n=>`<a class="${act==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${u(n[2]).split(' ')[0]}</a>`).join('');
 $('#lg').value=L;$('#np').innerHTML=NTF.map(n=>`<div class="nt ${n[0]}">${T(n[1])}</div>`).join('');
 $('#app').innerHTML=({home,prices,detail,services,nearby,knowledge,tools,profile,search})[page]();}
function pick(i){L=i;sv('lang',i);sv('langSet',1);$('#lm').style.display='none';document.documentElement.lang=['en','te','hi'][i];render()}
if(!ls('langSet',0))$('#lm').style.display='grid';
render();
</script></body></html>
